plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.hvy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    // GH Packages는 public 패키지도 읽기에 토큰이 필요하므로, 자격증명이 있을 때만 저장소를 추가한다.
    // (토큰 없는 환경은 기존과 동일하게 mavenCentral로 폴백)
    def gprUser = project.findProperty('gpr.user') ?: System.getenv('GHP_USER')
    def gprKey = project.findProperty('gpr.key') ?: System.getenv('GHP_TOKEN')
    if (gprUser && gprKey) {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/motolies/hvy-common')
            credentials {
                username = gprUser
                password = gprKey
            }
            // 이 저장소에서는 hvy-common만 조회 → 다른 의존성 요청이 GH Packages로 새지 않음
            content {
                includeModule('io.github.motolies', 'hvy-common')
            }
        }
    }
    mavenCentral()
}

// 기본 환경을 local로 설정 (커맨드라인에서 -Penv=prod로 변경 가능)
def env = project.findProperty("env") ?: "local"

dependencies {

    // Library
    if (env == "prod") {
        // 0.3.0: Spring Boot 4.1.1 / JDK 25 / Jackson 3 전환 (ObjectMapperConfigurer 반환형·RedisConfigurer 생성자 등 binary breaking, messaging 패키지 삭제)
        implementation 'io.github.motolies:hvy-common:0.3.1'
    } else {
        // MavenLocal에 배포된 hvy-common을 사용
        implementation 'io.github.motolies:hvy-common:local'
    }

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'

    // jdbc driver
    implementation 'org.postgresql:postgresql'

    // jwt (Jackson 기반 jjwt 직렬화기는 0.13 에서도 Jackson 2 결합이므로 gson 직렬화기로 교체)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'

    // shedlock
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.9.0'

    // html parsing (hot deal scraping)
    implementation 'org.jsoup:jsoup:1.23.2'


    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'

    // cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // logging
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    // testContainer
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // H2 Database(나중엔 테스트만 남겨야 함)
    runtimeOnly 'com.h2database:h2'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // mapstruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3' // mapstruct가 lombok 뒤에 있어야 함?
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' // @AutoConfigureMockMvc (Boot 4 에서 webmvc 테스트 스타터로 분리)
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.security:spring-security-test'

}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 JVM 타임존 고정 — 개발머신(KST)/CI 환경 차이에 의한 flaky 방지 (-Duser.timezone 으로 재정의 가능)
    systemProperty 'user.timezone', System.getProperty('user.timezone', 'UTC')
    // Mockito inline mock maker 의 동적 에이전트 self-attach 경고 제거 (JDK 21+)
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// JDK 25 (JEP 472): Redisson/Netty 네이티브 전송이 restricted method 를 호출할 때 나는 경고 제거
tasks.named('bootJar') {
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}
